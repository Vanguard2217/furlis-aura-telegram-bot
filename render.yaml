services:
  - type: web
    name: furlis-aura-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FOUNDER_ACTION_EMAIL
        sync: false
      - key: FOUNDER_TELEGRAM_ID
        sync: false
      - key: SUPPORT_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: UPI_GATEWAY_CHECKOUT_URL
        sync: false
      - key: SUPPORT_FORM_URL
        sync: false
      - key: SUPPORT_FORM_URLS_JSON
        sync: false
